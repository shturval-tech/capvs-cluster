metadata:
  name: ShturvalInit
spec:
  priority: 0
  files:
  - path: /etc/std
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /etc/kubernetes
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /etc/kubernetes/manifests
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /etc/kubernetes/pki
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /etc/kubernetes/pki/etcd
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /var/lib/etcd/
    type: directory
    mode: "0700"
    owner: etcd
    group: etcd
  - path: /etc/cni/net.d/
    type: directory
    mode: "0700"
    owner: root
    group: root
  - path: /var/lib/kubelet/
    type: directory
    mode: "0700"
    owner: root
    group: root
  {{- if not .Values.useExternalKubeAPILB }}
  - path: /etc/kubernetes/manifests/kube-vip.yaml
    type: file
    mode: "0644"
    owner: root
    group: root
    content: {{ include "capvs-cluster.kubeVipYaml" . | toJson }}
  {{- end }}
  {{- if .Values.secure }}
  - path: /etc/kubernetes/secrets_encryption.yaml
    type: file
    mode: "0600"
    owner: root
    group: root
    content: {{ include "capvs-cluster.encryptionConfigurationYaml" . | toJson }}
  - path: {{ .Values.auditPolicy.location }}
    type: file
    mode: "0600"
    owner: root
    group: root
    content: {{ include "capvs-cluster.auditPolicyYaml" . | toJson }}
  {{- end }}
  - path: /etc/containerd/
    type: directory
    mode: "0644"
    owner: root
    group: root
  - path: /etc/containerd/certs.d/
    type: directory
    mode: "0644"
    owner: root
    group: root
  - path: {{ printf "/etc/containerd/certs.d/%s" (include "capvs-cluster.defaultSystemRepo" .) }}
    type: directory
    mode: "0644"
    owner: root
    group: root
  {{- $kp := include "capvs-cluster.kubeadmPatchesEffective" . | fromYaml }}
  {{- $kpDir := index $kp "directory" | default "" }}
  {{- if $kpDir }}
  - path: {{ $kpDir }}
    type: directory
    mode: "0755"
    owner: root
    group: root
  {{- range $name, $patch := $kp }}
  {{- if and (kindIs "map" $patch) $patch.patchTemplate }}
  - path: {{ printf "%s/%s" $kpDir (include "capvs-cluster.kubeadmPatchFilename" (dict "name" $name "patch" $patch)) }}
    type: file
    mode: "0644"
    owner: root
    group: root
    content: {{ tpl ($.Files.Get $patch.patchTemplate) $ | toJson }}
  {{- end }}
  {{- end }}
  {{- end }}
  ntp:
    timezone: {{ ((.Values.ntp | default dict).timezone | default "Europe/Moscow") | quote }}
    {{- if and .Values.ntp .Values.ntp.ntpservers }}
    servers:
    {{- range .Values.ntp.ntpservers }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
  runtimecfg:
    cgroupdriver: systemd
    pauseimage: {{ include "capvs-cluster.pauseImage" . | quote }}
    registries:
    - name: {{ include "capvs-cluster.defaultSystemRepo" . | quote }}
      host: {{ printf "https://%s" .Values.systemregistry | quote }}
      capabilities:
      - resolve
      - pull
      {{- if eq (include "capvs-cluster.defaultSystemRepo" .) .Values.systemregistry }}
      license: {{ printf "Basic %s" (printf "user:%s" .Values.licensetoken | b64enc) | quote }}
      {{- end }}
  swap: {}
  kernelmodules:
  - name: br_netfilter
    autoload: true
  - name: ip_vs_rr
    autoload: true
  - name: zram
    autoload: false
    blacklist: true
  sysctl:
    param:
      fs.inotify.max_user_instances: "8192"
      kernel.panic: "10"
      kernel.panic_on_oops: "1"
      net.bridge.bridge-nf-call-iptables: "1"
      net.core.bpf_jit_harden: "0"
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
      vm.max_map_count: "262144"
      vm.overcommit_memory: "1"
  systemdunits:
  - name: containerd
    active: true
    enabled: true
  - name: kubelet
    active: true
    enabled: true
  users:
  - username: etcd
    shell: /sbin/nologin
    group: etcd
