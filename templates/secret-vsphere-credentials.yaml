apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capvs-cluster.capvs.credentialsSecretName" . }}
  namespace: {{ .Values.capvs.credentialsNamespace }}
  labels:
    {{- include "capvs-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.capvs.username | b64enc | quote }}
  password: {{ .Values.capvs.password | b64enc | quote }}
