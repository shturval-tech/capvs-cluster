{{- if .Values.etcd.external -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-apiserver-etcd-client
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capvs-cluster.labels" . | nindent 4 }}
data:
  tls.crt: {{ include "capvs-cluster.etcd.apiCrt" . }}
  tls.key: {{ include "capvs-cluster.etcd.apiKey" . }}
{{- end -}}
