{{- if and .Values.master.machineHealthCheck .Values.master.machineHealthCheck.enabled }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ .Release.Name }}-control-plane-healthcheck
  namespace: {{ .Release.Name }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
    {{- include "capvs-cluster.labels" . | nindent 4 }}
spec:
  checks:
{{- toYaml .Values.master.machineHealthCheck.checks | nindent 4 }}
  clusterName: {{ .Release.Name }}
  remediation:
{{- toYaml .Values.master.machineHealthCheck.remediation | nindent 4 }}
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane-name: {{ .Release.Name }}-control-plane
{{- end }}
