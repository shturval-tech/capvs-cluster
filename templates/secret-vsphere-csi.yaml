{{- if eq (include "capvs-cluster.csiSecretWanted" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capvs-cluster.csiSecretName" . }}
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capvs-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  data: {{ include "capvs-cluster.csiConfigYaml" . | b64enc | quote }}
{{- end }}
