{{- range $k, $v := .Values.workerNodes }}
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereMachineTemplate
metadata:
  name: {{ $.Release.Name }}-{{ $k }}
  namespace: {{ $.Release.Name }}
  labels:
    cluster-name: {{ $.Release.Name }}
    cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
    node-role.kubernetes.io/workers: ""
    {{- include "capvs-cluster.labels" $ | nindent 4 }}
spec:
  template:
    metadata: {}
    spec:
      {{- include "capvs-cluster.vspheremachine.spec" (dict "group" $v "root" $) | nindent 6 }}
---
{{- end }}
