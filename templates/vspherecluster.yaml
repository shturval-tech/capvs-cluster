apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: VSphereCluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Name }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ .Release.Name | quote }}
    {{- include "capvs-cluster.labels" . | nindent 4 }}
spec:
  controlPlaneEndpoint:
    host: {{ .Values.clusterAPI }}
    port: 6443
  identityRef:
    kind: VSphereClusterIdentity
    name: {{ include "capvs-cluster.capvs.identityName" . }}
  server: {{ .Values.capvs.server | quote }}
  {{- with .Values.capvs.thumbprint }}
  thumbprint: {{ . | quote }}
  {{- end }}
