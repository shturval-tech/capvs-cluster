{{- if .Values.secure }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-encryption-configuration
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capvs-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ include "capvs-cluster.encryptionSecretDataValue" . | quote }}
{{- end }}
